<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
  min-height: 100vh;
  background: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.gradient-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(to bottom, #ffffff, #999999);
  flex: 1;
  padding-bottom: 60px;
}

    /* ── Logo section ── */
    .logo {
  margin-top: 50px;
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 0 2px;
}

.logo img {
  width: 98%;
  max-width: 900px;
  min-width: 100px;
  height: auto;
}

    


    /* ── Page content ── */
    .content {
      margin-top: 50px;
      text-align: center;
      padding: 0 24px;
    }

    .content h1 {
      color: #4b555f;
      margin-top: 50px;
      font-size: clamp(2rem, 4vw, 5rem);
    }

    /*.content h2 {
      font-size: 4rem;
      color: #4b555f;
      margin-top: 10px;
      letter-spacing: 0.05em;
    }*/
    
    /* ── Navigation bar ── */
    .nav-bar {
      margin-top: 50px;
      width: 100%;
      background-color: #ffffff;
      display: flex;
      overflow: hidden;
    }
 
    .nav-bar a {
      flex: 1;
      text-align: center;
      padding: clamp(10px, 2vw, 18px) 0;
      text-decoration: none;
      font-size: clamp(0.75rem, 2.5vw, 2rem);
      font-weight: 600;
      color: #333333;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, color 0.2s;
    }
 
    .nav-bar a:hover {
      background-color: #4b555f;
      color: #ffffff;
    }
 
    .nav-bar a:not(:last-child) {
      border-right: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="#about">Buy</a>
    <a href="#services">Sell</a>
    <a href="#contact">Rent</a>
  </nav>
  
  <div class="logo">
    <img src="logo2.png" alt="My Logo" >
    </div>
   

<div class="gradient-section">
<div class="content">
    <h1>Coming Soon</h1>
  </div>
</div>

</body>
</html>
